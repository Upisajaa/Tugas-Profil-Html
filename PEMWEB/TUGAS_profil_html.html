<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Profil </title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8ef;
            text-align: center;
        }

        .foto {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 20px;
            border: 4px solid #d6b98c;
        }

        .profil {
            width: 285px;
            margin: 14px auto 10px;
            padding: 20px;
            background-color: #e8c9a6;
            border-radius: 40px;
        }

        .baris {
            display: flex;
            text-align: left;
            font-size: 12px;
            color: #493522;
            padding: 10px 5px;
        }

        .label {
            width: 75px;
            flex-shrink: 0;
        }

        .isi {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <img src="foto.jpg" alt="Foto Profil" class="foto">

    <div class="profil">
        <div class="baris">
            <span class="label">Nama</span>
            <span class="isi">Supriatna</span>
        </div>

        <div class="baris">
            <span class="label">Alamat</span>
            <span class="isi">nagreg, Bandung, Jawa Barat</span>
        </div>

        <div class="baris">
            <span class="label">Asal Kota</span>
            <span class="isi">Bandung</span>
        </div>

        <div class="baris">
            <span class="label">Gmail</span>
            <span class="isi">upisupriatna20@gmail.com</span>
        </div>
    </div>

</body>
</html>
